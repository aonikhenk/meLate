name: melate
description: MeLate - app simple de compañía para la tercera edad
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  sensors_plus: ^6.0.1
  vibration: ^3.2.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
